<html>
    <head>
        <title>Membuat Tabel</title>
    </head>
    <body>
        <table cellspacing="5">
            <tr>
                <td align="right">Ini baris pertama kolom pertama</td>
                <td align="right">Ini baris pertama kolom kedua</td>
            </tr>
            <tr>
                <td align="right">Ini baris kedua kolom pertama</td>

            </tr>
        </table>
    </body>
</html>
